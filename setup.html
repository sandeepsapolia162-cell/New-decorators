<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>First admin setup | Sepolia Decorators</title>
  <!-- Absolute URLs keep these styles working at the clean /admin/setup URL. -->
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/css/admin.css">
  <link rel="stylesheet" href="/css/setup.css">
  <style>
body, body.admin-body { opacity: 1 !important; visibility: visible !important; animation: none !important; transition: none !important; }
</style>
</head>
<body class="admin-body">
  <main class="dash setup-page">
    <section class="panel setup-panel">
      <p class="eyebrow">ONE-TIME SETUP</p>
      <h1>Create your administrator</h1>
      <p>Enter the SETUP_KEY secret you will add to Cloudflare Pages, then choose your email and a password of at least 12 characters.</p>
      <form id="setupForm" action="/api/setup" method="post">
        <label>Setup key<input name="key" type="password" required></label>
        <label>Email<input name="email" type="email" required></label>
        <label>Password<input name="password" type="password" minlength="12" required></label>
        <button class="btn btn-primary" type="submit">Create administrator</button>
        <p id="message" role="status" aria-live="polite"></p>
      </form>
    </section>
  </main>
  <!-- External same-origin script works with a script-src 'self' CSP. -->
  <script src="/js/setup.js" defer></script>
</body>
</html>
